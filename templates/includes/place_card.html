<div class="col-md-6 col-lg-4 mb-3 rs-place" data-search="{{ place.name|lower }} {{ place.address|lower }}">
  <div class="card h-100 shadow-sm rs-card">
    <div class="card-body">
      <span class="badge rs-badge mb-2">{{ place.category }}</span>
      {% if place.rating %}<span class="badge text-bg-warning mb-2">★ {{ place.rating|floatformat:1 }}</span>{% endif %}
      <h5 class="card-title">{{ place.name }}</h5>
      <p class="card-text text-muted">{{ place.address|truncatechars:40 }}</p>
      <p class="card-text">
        {% if place.price %}{{ place.price|floatformat:0 }} руб./чел.{% else %}Бесплатно{% endif %}
        · {{ place.hours }}
      </p>
      <a href="{% url 'places:detail' place.id %}" class="btn btn-sm btn-success">Подробнее</a>
    </div>
  </div>
</div>
